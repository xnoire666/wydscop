# OpenSSF Scorecard: an independent check of the repo's security habits (pinned actions, branch
# protection, code review, dependency updates and more). The score is published at
# https://scorecard.dev/viewer/?uri=github.com/xnoire666/wydscop and shown as a badge in the README;
# the details land in the repo's Security tab → Code scanning.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'   # every Monday, so the score stays current
  branch_protection_rule:   # re-check when branch protection changes
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # to upload the results to code scanning
      id-token: write          # to publish the results and get the badge

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
