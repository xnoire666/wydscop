# Builds and tests Wydscop on every push and pull request, and attaches a ready-to-run Wydscop.exe
# (self-contained, single file, no .NET install needed) to the run as a downloadable artifact.
#
# Every exe built for a push to this repo also gets a SHA256SUMS.txt and a GitHub build attestation:
# signed proof that this exact file came from this workflow and commit. Anyone can check it with
#   gh attestation verify Wydscop.exe --repo xnoire666/wydscop
# Pull requests skip the attestation (a fork's PR can't get the signing token it needs).
#
# Pushing a version tag (e.g. v1.2.0) also has SignPath sign that exe and publishes it as a GitHub
# Release. The signing job stays off until the repo has the SignPath settings (see CODE_SIGNING.md):
#   - variable SIGNPATH_ORGANIZATION_ID (Settings → Secrets and variables → Actions → Variables)
#   - secret   SIGNPATH_API_TOKEN
# After the release is made, the virustotal job scans its exe and adds the result to the release notes.
# It skips itself until the repo has the secret VIRUSTOTAL_API_KEY (a free virustotal.com account).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # for the build attestation's signing certificate
      attestations: write   # to store the attestation on the repo
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Wydscop.slnx -c Release

      - name: Test
        run: dotnet test Wydscop.slnx -c Release --no-build

      - name: Publish (self-contained single exe)
        run: >
          dotnet publish src/Wydscop/Wydscop.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - name: Checksum
        shell: bash
        run: cd publish && sha256sum Wydscop.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest where the exe came from
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: publish/Wydscop.exe

      # Kept to the exe alone: this is the artifact SignPath signs on version tags.
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: Wydscop-win-x64
          path: publish/Wydscop.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Wydscop-win-x64-SHA256SUMS
          path: publish/SHA256SUMS.txt
          retention-days: 30

  # Only for version tags: SignPath checks the exe was built by the job above from this repo, waits for
  # the release to be approved in SignPath, and hands back the signed exe.
  sign-and-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    permissions:
      contents: write       # to create the GitHub Release
      actions: read         # so SignPath can fetch the build artifact
      id-token: write       # signing changes the file, so the signed exe gets its own attestation
      attestations: write

    steps:
      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: wydscop
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Checksum the signed exe
        shell: bash
        run: cd signed && sha256sum Wydscop.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: signed/Wydscop.exe

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" signed/Wydscop.exe signed/SHA256SUMS.txt
          --repo "${{ github.repository }}" --title "Wydscop ${{ github.ref_name }}" --generate-notes

  # Scans the released exe on VirusTotal and appends the result ("0 of 69 security vendors flagged this
  # file", linked to the report) to the release notes. A flagged result is written down as it is, never
  # hidden, and also shows as a warning on the run so it can be checked and reported as a false alarm.
  virustotal:
    needs: sign-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to download the release's exe and edit its notes
    env:
      VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - name: Skip without an API key
        if: env.VT_KEY == ''
        run: echo "No VIRUSTOTAL_API_KEY secret; skipping the VirusTotal scan."

      - name: Scan on VirusTotal and note the result
        if: env.VT_KEY != ''
        run: |
          set -euo pipefail
          gh release download "$TAG" -p Wydscop.exe -D vt --repo "$REPO"
          sha=$(sha256sum vt/Wydscop.exe | cut -d' ' -f1)

          # The exe is over 32 MB, so it goes to a one-time large-file upload address.
          upload_url=$(curl -sSf -H "x-apikey: $VT_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
          analysis=$(curl -sSf -H "x-apikey: $VT_KEY" -F "file=@vt/Wydscop.exe" "$upload_url" | jq -r .data.id)

          # Poll every 30 s (the free API allows 4 requests a minute), for up to 20 minutes.
          status=queued
          for _ in $(seq 1 40); do
            sleep 30
            result=$(curl -sSf -H "x-apikey: $VT_KEY" "https://www.virustotal.com/api/v3/analyses/$analysis")
            status=$(jq -r .data.attributes.status <<<"$result")
            [ "$status" = completed ] && break
          done
          if [ "$status" != completed ]; then
            echo "::warning::The VirusTotal scan didn't finish in 20 minutes; add the result by hand: https://www.virustotal.com/gui/file/$sha"
            exit 0
          fi

          # Count engines that gave a verdict (not ones that timed out or don't support the file type).
          flagged=$(jq '.data.attributes.stats | .malicious + .suspicious' <<<"$result")
          total=$(jq '.data.attributes.stats | .malicious + .suspicious + .undetected + .harmless' <<<"$result")
          link="https://www.virustotal.com/gui/file/$sha"
          line="**VirusTotal:** [$flagged of $total security vendors flagged this file]($link) (scanned $(date -u '+%-d %b %Y'))."
          if [ "$flagged" -gt 0 ]; then
            echo "::warning::VirusTotal: $flagged of $total vendors flagged Wydscop.exe. Check $link and report false alarms."
          fi
          echo "$line"

          gh release view "$TAG" --repo "$REPO" --json body -q .body > notes.md
          printf '\n%s\n' "$line" >> notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
